[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mill-yard"
version = "0.1.0"
description = "Simulation and decision support for forestry mill-yard operations"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Lucas Bessai" },
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gui = ["arcade>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
mill-yard = "mill_yard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mill_yard"]


# ---------------------------------------------------------------- tooling

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -n auto"
markers = [
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "NPY", "PT", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mill_yard"]